<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduZone Learn</title>
<meta name="description" content="Interactive Grade 4 Math practice in English, Arabic and Egyptian conversational Arabic - Egyptian National and American curricula.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<header class="topbar">
  <a class="brand" href="#/">
    <img class="logo-img" src="eduzone-logo.png" alt="EduZone logo">

  <div class="controls"><a class="unified-back" href="../index.html" style="color:#fff;background:#134e65;border:1px solid #60baca;border-radius:14px;text-decoration:none;padding:10px 14px;font-weight:800">⌂ Learning Hub</a>
